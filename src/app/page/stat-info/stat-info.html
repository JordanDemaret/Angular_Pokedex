@if (appService.pokemon.isLoading()) {
    <app-loader></app-loader>
}
@else {
    <div>
        @for (s of appService.pokemon.value()!.stats; track s.stat) {
            <p>{{s.stat.name}} : {{s.base_stat}}</p>
        }
    </div>
    <div>
        <canvas 
                baseChart 
                [data]="radarStatData()"
                type="radar"
            ></canvas>
    </div>
   
}
